# Publish a release to the registries. It starts when a GitHub release is published (the draft
# that release.yml made, reviewed and published by a person). The three publishing jobs run in
# the `release` environment, which needs a person's approval; all three wait for `packages`, so
# they become ready together and one approval covers them.
#
# No registry token is stored: each registry trusts this workflow through OpenID Connect
# ("trusted publishing"), configured once on the registry for this repository, this file and
# the `release` environment. Actions are pinned to commit SHAs.
#
# Registries: crates.io (the source), and PyPI and npm, which carry the prebuilt binary: their
# packages are built from the release's own archives (tools/package-registries.mjs), checked
# against the release's checksums first.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  crates-io:
    # Waits for `packages` though it does not use them: so the approval is asked once, for all three.
    needs: packages
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: The release is the crate's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" = "$TAG"
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
  # The release's archives, checked, as registry packages: shared by the two jobs below.
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: The release's archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir archives && cd archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'affordance-*.tar.gz*'
          for sum in *.sha256; do shasum -a 256 -c "$sum"; done
      - name: Build the packages
        run: node tools/package-registries.mjs archives packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-packages
          path: packages
          if-no-files-found: error
  pypi:
    needs: packages
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-packages
          path: packages
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/pypi
  npm:
    needs: packages
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-packages
          path: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish (one package, with every platform's binary)
        run: |
          chmod +x packages/npm/affordance-rs/bin/*/affordance
          cd packages/npm/affordance-rs && npm publish --access public --provenance
