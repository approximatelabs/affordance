# Build the `affordance` binary for each platform.
#
# A release: push a version tag (`git tag v0.1.0 && git push origin v0.1.0`). The archives and
# their checksums are attached to a draft GitHub release; publishing that draft is a separate,
# deliberate step, and starts publish.yml.
#
# A dry run: start this workflow by hand (Actions > release > Run workflow). It builds the same
# archives and keeps them as workflow artifacts; nothing is tagged or released.
#
# Actions are pinned to commit SHAs.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built in the manylinux_2_28 image, so the binary runs on any distribution
          # with glibc 2.28 or newer (RHEL 8, Debian 10, Ubuntu 20.04), not only the runner's.
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, container: "quay.io/pypa/manylinux_2_28_x86_64"}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, container: "quay.io/pypa/manylinux_2_28_aarch64"}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: echo "version=v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: The tag is the crate's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME"
      - name: Rust 1.90
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.90.0 --profile minimal --target ${{ matrix.target }}
          rustup default 1.90.0
      - name: Build
        run: cargo build --release --locked --bin affordance --target ${{ matrix.target }}
      - name: It runs
        run: target/${{ matrix.target }}/release/affordance --help
      - name: Archive
        run: |
          name="affordance-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/affordance" LICENSE THIRD_PARTY_NOTICES.md README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v shasum > /dev/null; then shasum -a 256 "$name.tar.gz"; else sha256sum "$name.tar.gz"; fi > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affordance-${{ matrix.target }}
          path: affordance-*.tar.gz*
          if-no-files-found: error
  # The npm packages and Python wheels that carry the binary, built from the archives and tried:
  # what publish.yml will publish. Kept as a workflow artifact (a dry run shows them too).
  packages:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      - name: Build the packages
        run: node tools/package-registries.mjs archives packages
      - name: The npm package runs
        run: |
          mkdir try-npm && cd try-npm && npm init -y > /dev/null
          (cd ../packages/npm/affordance-rs && npm pack --silent)
          npm install --no-audit --no-fund ../packages/npm/affordance-rs/*.tgz
          ./node_modules/.bin/affordance --version
      - name: The wheel runs
        run: |
          python3 -m venv try-pypi
          try-pypi/bin/pip install --no-index packages/pypi/*manylinux*x86_64.whl
          try-pypi/bin/affordance --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-packages
          path: |
            packages/npm/*/*.tgz
            packages/pypi/*.whl
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes affordance-*.tar.gz*
