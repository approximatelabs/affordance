# The gate for pull requests and main. Actions are pinned to commit SHAs; nothing here has
# write access or secrets.
#
# The jobs run side by side and each compiles once. The tests are built in the `ci` profile
# (Cargo.toml): Affordance's own code built fast, its dependencies optimized. Compiled
# dependencies are kept between runs (rust-cache), so a run recompiles only what changed.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  # Every test that needs no reference data beyond a few tokenizers, in five shards that run at
  # the same time, each about the same length: shards 1 to 4 groups of the slower files (shard 1
  # also the TSX lint of the shipped views), shard 5 every other test.
  # The filters are name filters, so each test runs in exactly one shard. The tokenizers come
  # from this repository's own release (tools/fetch-test-tokenizers.sh), kept in the cache.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      SHARD_1: "resume_image:: session_agent::"
      SHARD_2: "hardening:: group_commit::"
      SHARD_3: "runtime:: page:: serve:: harness_consumer:: tool_traces:: agents_bin:: control:: http_connector:: spill::"
      SHARD_4: "runtime_http:: model_bindings:: features:: chat_render:: window:: pause_latency::"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Each shard keeps its own build: with one cache that only shard 1 saved, the other
          # shards' lookups sometimes came back empty and they compiled from nothing.
          shared-key: test-${{ matrix.shard }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tokenizers
        with:
          path: ref/tokenizers
          key: test-tokenizers-${{ hashFiles('tools/fetch-test-tokenizers.sh') }}
      - if: steps.tokenizers.outputs.cache-hit != 'true'
        run: ./tools/fetch-test-tokenizers.sh
      - name: Tests (shard ${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            1) filters=($SHARD_1) ;;
            2) filters=($SHARD_2) ;;
            3) filters=($SHARD_3) ;;
            4) filters=($SHARD_4) ;;
            *) filters=(); for f in $SHARD_1 $SHARD_2 $SHARD_3 $SHARD_4; do filters+=(--skip "$f"); done ;;
          esac
          cargo test --profile ci --locked --features test-tokenizers --lib --bins --tests -- --test-threads=8 "${filters[@]}"
      - if: matrix.shard == 1
        run: cargo run --profile ci --locked --bin affordance -- lint
  # Clippy on every feature: the longest of the checks, so a job of its own.
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
  # Formatting, clippy with no default features, the docs and the package's file list.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      # After a cargo step, so the dependencies it lists offline are downloaded.
      - run: ./tools/check-package.sh
  # The minimum supported Rust version still builds.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.89.0' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
      - run: cargo check --locked --all-targets
  # macOS: the command builds and the tests that need no reference data at all pass (not the
  # tokenizer tests, which Linux runs), in four shards. Every test binary runs even after one fails, so one run shows everything
  # that differs here.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_1: "hardening:: group_commit::"
      SHARD_2: "runtime_http:: model_bindings::"
      # The files that start processes and servers, slower here than on Linux.
      SHARD_3: "runtime:: reliability:: control:: agents_bin:: cli_run:: serve:: abort::"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Each shard keeps its own build: with one cache that only shard 1 saved, the other
          # shards' lookups sometimes came back empty and they compiled from nothing.
          shared-key: macos-${{ matrix.shard }}
      - name: Tests (shard ${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            # The bulk-allocation test copies gigabytes to check limits in Affordance's own code,
            # the same on every system; Linux runs it, and on macOS it alone is over a minute.
            1) filters=($SHARD_1 --skip hardening::bulk_allocations_throw_range_errors_instead_of_aborting) ;;
            2) filters=($SHARD_2) ;;
            3) filters=($SHARD_3) ;;
            *) filters=(); for f in $SHARD_1 $SHARD_2 $SHARD_3; do filters+=(--skip "$f"); done ;;
          esac
          cargo test --profile ci --locked --lib --bins --tests --no-fail-fast -- --test-threads=8 "${filters[@]}"
