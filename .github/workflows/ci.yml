# The gate for pull requests and main. Actions are pinned to commit SHAs; nothing here has
# write access or secrets.
#
# Five jobs run side by side: the checks, and the tests in two halves on Linux and on macOS. Each
# compiles once. The tests are built in the `ci` profile
# (Cargo.toml): Affordance's own code built fast, its dependencies optimized. Compiled
# dependencies are kept between runs (rust-cache), so a run recompiles only what changed.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  # Every test that needs no reference data beyond a few tokenizers, in two halves of about the
  # same length: half 1 the long single-threaded tests and a few heavy files, half 2 every other
  # test and the TSX lint of the shipped views. The filters are name filters, so each test runs in
  # exactly one half. The tokenizers come from this repository's own release
  # (tools/fetch-test-tokenizers.sh), kept in the cache.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    env:
      HALF_1: "session_agent:: pause_latency:: hardening:: features:: group_commit:: chat_render:: resume_image::"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Each half keeps its own build: with one shared cache, the second job's lookup
          # sometimes came back empty and it compiled from nothing.
          shared-key: test-${{ matrix.half }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tokenizers
        with:
          path: ref/tokenizers
          key: test-tokenizers-${{ hashFiles('tools/fetch-test-tokenizers.sh') }}
      - if: steps.tokenizers.outputs.cache-hit != 'true'
        run: ./tools/fetch-test-tokenizers.sh
      - name: Tests (half ${{ matrix.half }})
        run: |
          if [ "${{ matrix.half }}" = 1 ]; then filters=($HALF_1)
          else filters=(); for f in $HALF_1; do filters+=(--skip "$f"); done; fi
          cargo test --profile ci --locked --features test-tokenizers --lib --bins --tests -- --test-threads=8 "${filters[@]}"
      - if: matrix.half == 2
        run: cargo run --profile ci --locked --bin affordance -- lint
  # Formatting, clippy (every feature, and none), the docs, the package's file list, and a check
  # that the minimum supported Rust version still builds.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      # After a cargo step, so the dependencies it lists offline are downloaded.
      - run: ./tools/check-package.sh
      - name: Rust 1.89 builds
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --all-targets --target-dir target/msrv
  # macOS: the command builds and the tests that need no reference data at all pass (not the
  # tokenizer tests, which Linux runs), in two halves. Every test binary runs even after one
  # fails, so one run shows everything that differs here.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    env:
      # The files that start processes and servers, slower here than on Linux.
      HALF_1: "hardening:: group_commit:: runtime_http:: model_bindings:: runtime:: reliability:: control:: agents_bin:: cli_run:: serve:: abort::"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          # Only this toolchain: the cache key hashes every installed one, and the runner's
          # preinstalled stable changes from image to image.
          rustup toolchain list | cut -d' ' -f1 | grep -v '^1.90.0' | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-${{ matrix.half }}
      - name: Tests (half ${{ matrix.half }})
        run: |
          if [ "${{ matrix.half }}" = 1 ]; then filters=($HALF_1)
          else filters=(); for f in $HALF_1; do filters+=(--skip "$f"); done; fi
          cargo test --profile ci --locked --lib --bins --tests --no-fail-fast -- --test-threads=8 "${filters[@]}"
